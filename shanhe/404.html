<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 ｜ 山河摆渡人</title>
<style>
  :root { --ink:#5A1A1C; --ink-2:#6E2224; --red:#E8324A; --red-lit:#FF8A72; --paper:#FBF4EA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 42%, rgba(232,50,74,.20) 0%, transparent 70%),
      linear-gradient(180deg, var(--ink-2) 0%, var(--ink) 60%);
    color:var(--paper);
    font-family:"Songti SC","SimSun",serif; text-align:center; padding:24px;
  }
  .wrap { max-width:560px; position:relative; }
  .mark {
    width:88px; height:88px; margin:0 auto 32px; border-radius:50%;
    border:2px solid var(--red); display:flex; align-items:center; justify-content:center;
    font-size:40px; color:var(--red-lit); letter-spacing:2px;
    box-shadow:0 0 40px rgba(232,50,74,.42), inset 0 0 24px rgba(232,50,74,.20);
  }
  h1 { font-size:30px; font-weight:400; letter-spacing:8px; margin-bottom:18px; }
  p { font-size:15px; line-height:2; opacity:.72; letter-spacing:2px; }
  a {
    display:inline-block; margin-top:36px; padding:13px 34px;
    border:1px solid var(--red); color:var(--red-lit); text-decoration:none;
    font-size:14px; letter-spacing:4px; transition:.25s;
  }
  a:hover { background:var(--red); color:var(--paper); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">渡</div>
    <h1>此路不通</h1>
    <p>你要找的页面不在此处。<br>渡口只有一条，回起点去吧。</p>
    <a href="./">回到《山河摆渡人》</a>
  </div>
</body>
</html>
